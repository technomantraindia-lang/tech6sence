<!DOCTYPE html>
<html>
<head>
    <title>Docx Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fafafa; }
        #output { padding: 20px; background: white; border: 1px solid #ccc; margin-top: 20px; white-space: pre-wrap; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>Upload DOCX File to Extract Text</h2>
    <input type="file" id="filePicker">
    <div id="output">Uploaded file content will appear here...</div>

    <script>
        document.getElementById('filePicker').addEventListener('change', function(event) {
            var reader = new FileReader();
            reader.onload = function(loadEvent) {
                var arrayBuffer = loadEvent.target.result;
                mammoth.extractRawText({arrayBuffer: arrayBuffer})
                    .then(function(result) {
                        document.getElementById('output').innerText = result.value;
                        console.log("Extraction complete!");
                    })
                    .catch(function(err) {
                        document.getElementById('output').innerText = "Error: " + err;
                    });
            };
            reader.readAsArrayBuffer(event.target.files[0]);
        });
    </script>
</body>
</html>
